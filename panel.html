<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyRAG Panel</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f8fafc;
        color: #111827;
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid #e5e7eb;
        background: #fff;
      }

      h1 {
        margin: 0;
        font-size: 16px;
      }

      .icon-button {
        width: 30px;
        height: 30px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
        color: #374151;
        font-size: 18px;
        cursor: pointer;
      }

      main {
        padding: 12px;
      }

      .search-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      input {
        min-width: 0;
        height: 36px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        padding: 0 10px;
        font: 13px inherit;
      }

      button {
        height: 36px;
        border: 0;
        border-radius: 7px;
        background: #2563eb;
        color: #fff;
        padding: 0 12px;
        font: 650 13px inherit;
        cursor: pointer;
      }

      button.secondary {
        width: 100%;
        margin-top: 10px;
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #111827;
      }

      .card {
        margin-top: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 10px;
        border-bottom: 1px solid #eef2f7;
        font-size: 12px;
        font-weight: 750;
        color: #374151;
      }

      .card-body {
        padding: 10px;
        font-size: 13px;
        line-height: 1.48;
        white-space: pre-wrap;
      }

      .badge {
        flex: none;
        border-radius: 999px;
        padding: 3px 7px;
        background: #fef3c7;
        color: #92400e;
        font-size: 11px;
        font-weight: 750;
      }

      .badge.good {
        background: #dcfce7;
        color: #166534;
      }

      mark {
        border-radius: 3px;
        background: #fde68a;
        padding: 0 2px;
      }

      .muted {
        color: #6b7280;
      }

      .history {
        margin-top: 14px;
      }

      .history h2 {
        margin: 0 0 8px;
        font-size: 12px;
        color: #4b5563;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .history button {
        display: block;
        width: 100%;
        height: auto;
        margin: 0 0 6px;
        border: 1px solid #e5e7eb;
        background: #fff;
        color: #111827;
        padding: 8px;
        text-align: left;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>StudyRAG</h1>
        <button id="closePanel" class="icon-button" title="Close panel" aria-label="Close panel">&times;</button>
      </header>

      <main>
        <div class="search-row">
          <input id="query" type="search" placeholder="Type or paste a question">
          <button id="search">Search</button>
        </div>

        <section class="card">
          <div class="card-head">
            <span>From your notes</span>
            <span id="confidence" class="badge">0%</span>
          </div>
          <div id="notesResult" class="card-body muted">Select text on a page or type a question above.</div>
        </section>

        <section class="card">
          <div class="card-head">
            <span>AI explanation</span>
            <span id="provider" class="muted"></span>
          </div>
          <div id="aiResult" class="card-body muted">AI will explain when a direct notes answer is not available.</div>
        </section>

        <button id="quizMe" class="secondary">Quiz me</button>

        <section class="card" id="quizCard" hidden>
          <div class="card-head">
            <span>Practice question</span>
            <span id="quizProvider" class="muted"></span>
          </div>
          <div id="quizResult" class="card-body"></div>
        </section>

        <section class="history">
          <h2>History</h2>
          <div id="history"></div>
        </section>
      </main>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
