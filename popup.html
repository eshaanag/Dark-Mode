<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyRAG</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 360px;
        margin: 0;
        background: #f8fafc;
        color: #111827;
      }

      main {
        padding: 14px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 17px;
        font-weight: 700;
      }

      textarea,
      input,
      select {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        background: #fff;
        color: #111827;
        font: 13px inherit;
      }

      textarea {
        min-height: 190px;
        padding: 10px;
        resize: vertical;
        line-height: 1.4;
      }

      input,
      select {
        height: 34px;
        padding: 7px 9px;
      }

      label {
        display: block;
        margin-top: 10px;
        font-size: 12px;
        font-weight: 650;
        color: #374151;
      }

      button {
        width: 100%;
        height: 36px;
        margin-top: 12px;
        border: 0;
        border-radius: 7px;
        background: #2563eb;
        color: #fff;
        font: 650 13px inherit;
        cursor: pointer;
      }

      button:disabled {
        background: #93c5fd;
        cursor: wait;
      }

      .section-title {
        margin: 14px 0 4px;
        font-size: 12px;
        font-weight: 750;
        color: #1f2937;
      }

      .status {
        min-height: 18px;
        margin-top: 10px;
        font-size: 12px;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>StudyRAG</h1>
      <textarea id="notes" placeholder="Paste your study notes, Q&A pairs, or summaries here..."></textarea>
      <button id="save">Load Notes</button>

      <div class="section-title">AI settings</div>
      <label for="grokKey">Grok API Key</label>
      <input id="grokKey" type="password" autocomplete="off">

      <label for="geminiKey">Gemini API Key</label>
      <input id="geminiKey" type="password" autocomplete="off">

      <label for="ollamaUrl">Ollama URL</label>
      <input id="ollamaUrl" type="url" value="http://localhost:11434">

      <label for="primaryAI">Primary AI</label>
      <select id="primaryAI">
        <option value="grok">Grok</option>
        <option value="gemini">Gemini</option>
        <option value="ollama">Ollama</option>
      </select>

      <div id="status" class="status">0 chunks indexed | Ready</div>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
