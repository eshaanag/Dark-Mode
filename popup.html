<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>StudyRAG</title>
    <style>
      body { width: 360px; margin: 0; background: #f8fafc; color: #111827; font-family: sans-serif; }
      main { padding: 14px; }
      h1 { margin: 0 0 10px; font-size: 17px; font-weight: 700; }
      textarea { box-sizing: border-box; width: 100%; min-height: 190px; padding: 10px; border: 1px solid #d1d5db; border-radius: 7px; font: 13px inherit; resize: vertical; }
      input, select { box-sizing: border-box; width: 100%; height: 34px; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 7px; font: 13px inherit; margin-top: 6px; }
      label { display: block; margin-top: 10px; font-size: 12px; font-weight: 600; color: #374151; }
      button { width: 100%; height: 36px; margin-top: 12px; border: 0; border-radius: 7px; background: #2563eb; color: #fff; font: 600 13px sans-serif; cursor: pointer; }
      button:disabled { background: #93c5fd; }
      .status { margin-top: 10px; font-size: 12px; color: #4b5563; min-height: 18px; }
      .tip { margin-top: 8px; padding: 8px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; font-size: 11px; color: #1e40af; }
    </style>
  </head>
  <body>
    <main>
      <h1>StudyRAG</h1>
      <textarea id="notes" placeholder="Paste your notes or Q&A here..."></textarea>
      <button id="save">Load Notes</button>
      <div class="tip">After loading: click extension icon to open panel, then select text on page and click the blue button.</div>
      <label>Grok API Key</label>
      <input id="grokKey" type="password" placeholder="xai-...">
      <label>Gemini API Key</label>
      <input id="geminiKey" type="password" placeholder="AIza...">
      <label>Ollama URL</label>
      <input id="ollamaUrl" type="url" value="http://localhost:11434">
      <label>Primary AI</label>
      <select id="primaryAI">
        <option value="grok">Grok</option>
        <option value="gemini">Gemini</option>
        <option value="ollama">Ollama</option>
      </select>
      <div id="status" class="status">0 chunks indexed</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
